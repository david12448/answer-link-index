<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>답지 통합 검색</title>
  <meta name="description" content="초중고 교과서·문제집·자습서의 공식 정답 및 해설 링크를 한 번에 검색합니다.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">OFFICIAL STUDY MATERIAL INDEX</p>
      <h1>답지 통합 검색</h1>
      <p class="hero-copy">초·중·고 교과서, 문제집, 자습서의 공식 정답·해설 자료 위치를 한 곳에서 찾습니다.</p>
      <label class="search-box">
        <span class="sr-only">교재 검색</span>
        <input id="searchInput" type="search" placeholder="예: 하이탑 중2 과학, 만점왕 1-1, 100발 중2 수학">
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="검색 필터">
      <select id="schoolFilter"><option value="">학교급 전체</option></select>
      <select id="gradeFilter"><option value="">학년 전체</option></select>
      <select id="subjectFilter"><option value="">과목 전체</option></select>
      <select id="publisherFilter"><option value="">출판사 전체</option></select>
      <select id="brandFilter"><option value="">브랜드 전체</option></select>
      <button id="resetButton" type="button">초기화</button>
    </section>

    <section class="summary">
      <strong id="resultCount">0</strong>개의 교재
      <span id="updatedAt"></span>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <template id="bookTemplate">
      <article class="book-card">
        <div class="book-topline">
          <span class="school-badge"></span>
          <span class="status-badge"></span>
        </div>
        <h2 class="book-title"></h2>
        <p class="book-meta"></p>
        <p class="book-submeta"></p>
        <div class="materials"></div>
      </article>
    </template>
  </main>

  <footer class="footer wrap">
    <p>이 사이트는 자료 파일을 재배포하지 않고 공식 제공처로 연결합니다. 링크 상태는 마지막 확인 시점 이후 변경될 수 있습니다.</p>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
