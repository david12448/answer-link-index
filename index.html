<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>답지 통합 검색</title>
  <meta name="description" content="초중고 교과서·문제집·자습서의 공식 정답 및 해설 링크를 한 번에 검색합니다.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="wrap">
      <p class="eyebrow">OFFICIAL STUDY MATERIAL INDEX</p>
      <h1>답지 통합 검색</h1>
      <p class="hero-copy">초·중·고 교과서, 문제집, 자습서의 공식 정답·해설 자료 위치를 한 곳에서 찾습니다.</p>
    </div>
  </header>

  <main class="wrap app-shell">
    <section class="scope-heading" id="scopeHeading" hidden>
      <p class="scope-kicker">공식 학습자료</p>
      <h1 id="scopeTitle">교재 자료</h1>
    </section>

    <nav class="school-shortcuts" id="schoolShortcuts" aria-label="학교급 빠른 선택" hidden>
      <span class="school-shortcuts-label">학교급</span>
      <div class="school-shortcuts-buttons">
        <button type="button" data-level="" aria-pressed="true" class="is-active">전체</button>
        <button type="button" data-level="elementary" aria-pressed="false">초등</button>
        <button type="button" data-level="middle" aria-pressed="false">중등</button>
        <button type="button" data-level="high" aria-pressed="false">고등</button>
      </div>
    </nav>

    <section class="filters" id="filters" aria-label="검색 필터">
      <label class="filter-field search-filter-field" id="searchField">
        <span>교재 검색</span>
        <input id="searchInput" type="search" placeholder="교재명·시리즈명 검색 (예: 만점왕 수학, 수능완성 영어)">
      </label>
      <label class="filter-field" id="publisherField">
        <span>출판사</span>
        <select id="publisherFilter"><option value="">출판사 전체</option></select>
      </label>
      <label class="filter-field" id="subjectField">
        <span>과목</span>
        <select id="subjectFilter"><option value="">과목 전체</option></select>
      </label>
      <label class="filter-field" id="gradeField">
        <span>학년</span>
        <select id="gradeFilter"><option value="">학년 전체</option></select>
      </label>
      <label class="filter-field" id="bookField">
        <span>교재</span>
        <select id="bookFilter"><option value="">교재 선택</option></select>
      </label>
      <button id="resetButton" class="reset-button" type="button">초기화</button>
    </section>

    <section class="toolbar" id="toolbar">
      <div class="summary">
        <strong id="resultCount">0</strong>개의 교재
        <span id="updatedAt"></span>
      </div>
      <div class="view-switch" id="viewSwitch" aria-label="보기 방식">
        <button id="listViewButton" type="button" class="is-active" aria-pressed="true">목록형</button>
        <button id="coverViewButton" type="button" aria-pressed="false">표지형</button>
      </div>
    </section>

    <section id="results" class="results list-view" aria-live="polite"></section>
    <button id="loadMoreButton" class="load-more" type="button" hidden>20개 더 보기</button>

    <template id="bookTemplate">
      <article class="book-card">
        <a class="cover-link">
          <span class="cover-placeholder" aria-hidden="true">교재 표지</span>
          <img class="cover-image" alt="" loading="lazy">
        </a>
        <div class="book-content">
          <div class="book-topline">
            <span class="school-badge"></span>
            <span class="status-badge"></span>
          </div>
          <h2 class="book-title"></h2>
          <p class="book-meta"></p>
          <p class="book-submeta"></p>
          <p class="book-intro" hidden></p>
          <div class="materials"></div>
          <div class="book-secondary-links" hidden></div>
          <div class="publisher-download-box" hidden>
            <p>여기서 바로 받지 않고 출판사 사이트에서 확인하려면 공식 교재 페이지를 이용해 주세요.</p>
            <a class="publisher-download-link" target="_blank" rel="noopener noreferrer">출판사 페이지에서 확인·다운로드</a>
          </div>
          <p class="official-hint">교재명 또는 자료 뱃지를 누르면 이 사이트의 교재 상세 페이지가 열립니다.</p>
        </div>
      </article>
    </template>
  </main>

  <footer class="footer wrap" id="footer">
    <p>자료 파일을 재배포하지 않고 공식 제공처로 연결합니다. 링크 상태는 마지막 확인 시점 이후 변경될 수 있습니다.</p>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
