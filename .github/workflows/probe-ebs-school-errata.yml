name: Probe EBS school errata

on:
  pull_request:
    paths:
      - "scripts/collectors/ebs_school_errata_probe.py"
      - ".github/workflows/probe-ebs-school-errata.yml"
      - "data/catalog.json"
  workflow_dispatch:
    inputs:
      limit_per_site:
        description: "학교급별 점검 권수. 0은 전체, 기본 4권씩"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Probe EBS 초등·중학 정오표
        shell: bash
        run: |
          LIMIT="${{ inputs.limit_per_site }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="4"
          fi
          python scripts/collectors/ebs_school_errata_probe.py \
            --catalog data/catalog.json \
            --limit-per-site "$LIMIT" \
            --output ebs-school-errata-probe.json

      - name: Print compact summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("ebs-school-errata-probe.json").read_text(encoding="utf-8"))
          print("## EBS 초등·중학 정오표 probe")
          for item in data.get("results", []):
              title = item.get("title") or item.get("book_id")
              matched = (item.get("matched_row") or {}).get("text")
              direct = len(item.get("direct_candidates", []))
              error = item.get("error")
              if error:
                  print(f"- ❌ {title}: {error}")
              else:
                  print(f"- {'✅' if direct else '⚪'} {title}: 정오표 게시물={matched or '없음/미확인'}, 첨부={direct}")
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ebs-school-errata-probe
          path: ebs-school-errata-probe.json
          if-no-files-found: error
