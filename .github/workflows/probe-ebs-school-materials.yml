name: Probe EBS school materials

on:
  pull_request:
    paths:
      - "scripts/collectors/ebs_school_material_probe.py"
      - ".github/workflows/probe-ebs-school-materials.yml"
      - "data/catalog.json"
  workflow_dispatch:
    inputs:
      limit_per_site:
        description: "학교급별 조사 권수. 0은 전체, 기본 3권씩"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Probe EBS 초등/중학 정답지 자료
        run: |
          python scripts/collectors/ebs_school_material_probe.py \
            --catalog data/catalog.json \
            --limit-per-site "${{ inputs.limit_per_site || '3' }}" \
            --output ebs-school-material-probe.json

      - name: Print summary
        run: cat ebs-school-material-probe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ebs-school-material-probe
          path: ebs-school-material-probe.json
          if-no-files-found: error
