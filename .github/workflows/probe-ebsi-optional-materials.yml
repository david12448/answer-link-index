name: Probe EBSi optional materials

on:
  pull_request:
    paths:
      - "scripts/collectors/ebsi_optional_material_probe.py"
      - ".github/workflows/probe-ebsi-optional-materials.yml"
      - "data/catalog.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Probe MP3 and additional materials
        run: |
          python scripts/collectors/ebsi_optional_material_probe.py \
            --catalog data/catalog.json \
            --output ebsi-optional-material-probe.json

      - name: Print compact summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("ebsi-optional-material-probe.json").read_text(encoding="utf-8"))
          print("## EBSi optional material probe")
          for item in data.get("results", []):
              title = item.get("title") or item.get("book_id")
              kind = item.get("kind")
              visible = item.get("title_visible")
              rows = len(item.get("matching_rows", []))
              error = item.get("error")
              if error:
                  print(f"- ❌ {title} / {kind}: {error}")
              else:
                  print(f"- {'✅' if visible or rows else '⚠️'} {title} / {kind}: title_visible={visible}, matching_rows={rows}")
          PY

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: ebsi-optional-material-probe
          path: ebsi-optional-material-probe.json
          if-no-files-found: error
