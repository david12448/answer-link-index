name: Probe EBSi optional materials

on:
  pull_request:
    paths:
      - "scripts/collectors/ebsi_optional_material_probe.py"
      - ".github/workflows/probe-ebsi-optional-materials.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/collector-change-gate.yml
    with:
      paths: '["scripts/collectors/ebsi_optional_material_probe.py", ".github/workflows/probe-ebsi-optional-materials.yml"]'
  probe:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Probe MP3 and additional materials
        run: |
          python scripts/collectors/ebsi_optional_material_probe.py \
            --catalog data/catalog.json \
            --output ebsi-optional-material-probe.json

      - name: Print compact summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("ebsi-optional-material-probe.json").read_text(encoding="utf-8"))
          print("## EBSi optional material probe")
          for item in data.get("results", []):
              title = item.get("title") or item.get("book_id")
              kind = item.get("kind")
              visible = item.get("title_visible")
              rows = len(item.get("matching_rows", []))
              mp3_count = item.get("mp3_file_count", 0)
              whole_count = len(item.get("whole_file_candidates", []))
              error = item.get("error")
              if error:
                  print(f"- ❌ {title} / {kind}: {error}")
              else:
                  print(
                      f"- {'✅' if visible or rows or mp3_count else '⚠️'} {title} / {kind}: "
                      f"title_visible={visible}, matching_rows={rows}, "
                      f"mp3_files={mp3_count}, combined={whole_count}"
                  )
          PY

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: ebsi-optional-material-probe
          path: ebsi-optional-material-probe.json
          if-no-files-found: error
