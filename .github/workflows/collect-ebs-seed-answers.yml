name: Collect EBS seed answers

on:
  pull_request:
    paths:
      - "scripts/collectors/ebs_batch_collect.py"
      - "scripts/collectors/ebs_browser_probe.py"
      - ".github/workflows/collect-ebs-seed-answers.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/collector-change-gate.yml
    with:
      paths: '["scripts/collectors/ebs_batch_collect.py", "scripts/collectors/ebs_browser_probe.py", ".github/workflows/collect-ebs-seed-answers.yml"]'
  collect:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Collect direct answer URLs for current EBS catalog
        run: |
          cd scripts/collectors
          python ebs_batch_collect.py \
            --catalog ../../data/catalog.json \
            --output ../../ebs-seed-answers.json

      - name: Print summary
        run: cat ebs-seed-answers.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload batch result
        uses: actions/upload-artifact@v4
        with:
          name: ebs-seed-answers
          path: ebs-seed-answers.json
          if-no-files-found: error
