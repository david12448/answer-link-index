name: Sync EBSi MP3

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 2,5"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Check EBSi English books for MP3
        run: |
          python scripts/collectors/ebsi_mp3_sync.py \
            --catalog data/catalog.json \
            --report ebsi-mp3-sync-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ebsi-mp3-sync-report
          path: ebsi-mp3-sync-report.json
          if-no-files-found: error

      - name: Detect catalog changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request for confirmed MP3 material
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ebsi-mp3
          delete-branch: true
          commit-message: "data: refresh verified EBSi MP3 links"
          title: "data: EBSi 영어 MP3 자료 링크 반영"
          body: |
            EBSi 영어 교재에서 실제 MP3 파일 목록이 확인된 교재만 MP3 뱃지를 활성화한 PR입니다.

            자동 반영 조건:
            1. 교재 검색 결과에서 정확한 EBS bookId 상세 페이지 진입
            2. 해당 상세 페이지에 실제 MP3 파일이 1개 이상 존재
            3. 모든 파일 URL이 EBS 공식 wdown.ebsi.co.kr/bookmp3/{bookId}/ 경로
            4. 개별 파일 하나를 대표 direct_url로 선택하지 않고 교재별 MP3 상세 페이지를 연결

            확인 후 병합해 주세요.
