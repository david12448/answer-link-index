name: Probe EBS errata links

on:
  pull_request:
    paths:
      - "scripts/collectors/ebs_errata_probe.py"
      - ".github/workflows/probe-ebs-errata.yml"
      - "data/catalog.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Probe current EBS errata paths
        run: |
          python scripts/collectors/ebs_errata_probe.py \
            --catalog data/catalog.json \
            --output ebs-errata-probe.json

      - name: Print summary
        run: cat ebs-errata-probe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ebs-errata-probe
          path: ebs-errata-probe.json
          if-no-files-found: error
