name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jsonschema
      - run: python scripts/validate_data.py
      - run: python -m py_compile scripts/collectors/*.py
      - run: node --check assets/app.js
      - run: node scripts/test_ui_filters.cjs
