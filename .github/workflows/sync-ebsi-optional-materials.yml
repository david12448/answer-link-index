name: Sync EBSi optional materials

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * 3"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Check EBSi MP3/additional material availability
        run: |
          python scripts/collectors/ebsi_optional_material_sync.py \
            --catalog data/catalog.json \
            --report ebsi-optional-material-sync-report.json

      - name: Upload check report
        uses: actions/upload-artifact@v4
        with:
          name: ebsi-optional-material-sync-report
          path: ebsi-optional-material-sync-report.json
          if-no-files-found: error

      - name: Detect catalog changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request for confirmed optional materials
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ebsi-optional-materials
          delete-branch: true
          commit-message: "data: refresh EBSi optional material availability"
          title: "data: EBSi MP3/부가자료 노출 상태 갱신"
          body: |
            EBSi 교재의 MP3/부가자료 존재 여부를 점검한 자동 PR입니다.

            운영 원칙:
            - 실제 교재별 MP3 상세 화면과 파일 목록이 확인된 경우에만 MP3 뱃지를 표시
            - 파일이 확인되지 않으면 unavailable로 단정하지 않고 unknown으로 유지
            - 부가자료는 교재 일치 검증이 더 필요한 동안 자동 available 승격하지 않음
            - 기존 확인 자료를 일시적 네트워크 오류 때문에 숨기지 않음

            변경된 교재를 확인한 뒤 병합해 주세요.
