name: Sync EBS school errata

on:
  workflow_dispatch:
    inputs:
      limit_per_site:
        description: "학교급별 점검 권수. 0은 전체, 기본 6권씩"
        required: false
        default: "6"
  schedule:
    - cron: "15 1 * * 1,4"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Check EBS 초등·중학 for newly published errata
        shell: bash
        run: |
          LIMIT="${{ inputs.limit_per_site }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="6"
          fi
          python scripts/collectors/ebs_school_errata_sync.py \
            --catalog data/catalog.json \
            --limit-per-site "$LIMIT" \
            --report ebs-school-errata-sync-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ebs-school-errata-sync-report
          path: ebs-school-errata-sync-report.json
          if-no-files-found: error

      - name: Detect catalog changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request for confirmed errata
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ebs-school-errata
          delete-branch: true
          commit-message: "data: add verified EBS school errata"
          title: "data: EBS 초등·중등 새 정오표 링크 반영"
          body: |
            EBS 초등·중등 정오표를 주기적으로 확인해 실제 교재별 정오표 게시물이 검증된 경우만 반영한 PR입니다.

            자동 반영 조건:
            1. 정오표 게시물 제목에 대상 교재명이 정확히 포함
            2. 해당 정오표 상세 화면 진입 성공
            3. 게시물 존재가 확인되면 availability=available로 표시
            4. 공식 첨부가 정확히 1개이고 실제 파일 응답까지 검증되면 direct_url도 연결
            5. 첨부가 여러 개면 임의 선택하지 않고 정오표 상세 페이지로 연결

            유사한 다른 학년/학기, 검색 실패, 네트워크 오류는 자동 반영하지 않습니다.
