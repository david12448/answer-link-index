name: Public site browser smoke

on:
  pull_request:
    paths:
      - "assets/**"
      - "index.html"
      - "scripts/build_public_site.py"
      - "scripts/test_public_site_browser.py"
      - ".github/workflows/public-site-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/collector-change-gate.yml
    with:
      paths: '["assets/**", "index.html", "scripts/build_public_site.py", "scripts/test_public_site_browser.py", ".github/workflows/public-site-smoke.yml"]'
  smoke:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_public_site_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-mobile-smoke
          path: public-site-smoke/
